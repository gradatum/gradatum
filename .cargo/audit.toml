# Configuration de `cargo audit` (RustSec) — gradatum
# Lu par cargo-audit 0.22.1 depuis `.cargo/audit.toml` (emplacement vérifié
# empiriquement le 2026-07-31 : un `audit.toml` à la racine du dépôt N'EST PAS lu,
# EXIT reste 1 ; seul `.cargo/audit.toml` fait passer le gate à EXIT 0).
#
# ── RUSTSEC-2023-0071 / rsa 0.9.10 — Marvin Attack (5.9 medium) ──────────────────
#
# Unique exemption de ce fichier, et volontairement la seule. Elle fait taire
# `cargo audit` — PAS `cargo deny`. Répartition des rôles :
#   • `cargo audit` lit `Cargo.lock` À PLAT : il signale toute crate présente dans
#     le lockfile, qu'elle soit compilée ou non. rsa y figure comme simple ligne.
#   • `cargo deny check` lit le GRAPHE RÉSOLU : il ne voit que ce qui est
#     effectivement tiré par les features activées.
# On fait donc taire l'outil qui regarde au mauvais endroit, pas la détection.
# `deny.toml` ne porte AUCUNE exemption pour rsa (c'est documenté et délibéré,
# cf. le bloc dédié en bas de `deny.toml`) : si la faille devenait atteignable,
# c'est `cargo deny` qui partirait ROUGE. La détection reste armée là où elle
# compte.
#
# Inatteignabilité — re-mesurée le 2026-08-29 (après le retrait complet de sqlx du
# graphe le 2026-08-25, montée rusqlite =0.40.2 — cf. Cargo.toml) :
#   cargo tree -i rsa -e normal                        -> « error: package ID
#     specification `rsa` did not match any packages »
#   cargo tree -i rsa --target all -e normal,build,dev -> idem
#   grep -rn '"mysql"' --include=Cargo.toml .          -> aucune activation
# (le libellé de sortie a changé depuis la mesure précédente — « nothing to print » —
# le constat reste identique : rsa n'est dans AUCUN graphe résolu par défaut, toutes
# cibles et tous types d'arêtes confondus.)
# Un seul chemin reste possible, et il passe par une feature non sélectionnée :
#   rsa 0.9.10 → reqsign-google 3.0.3 / reqsign-core 3.2.0 / reqsign-azure-storage
#     3.1.1 → opendal-service-{gcs,azblob} 0.58.1 → opendal 0.58.1 →
#     gradatum-storage (backends cloud `gcs`/`azure` d'opendal, non activés par défaut
#     ni par la CI — seul le service local `fs` est utilisé). Le backend `s3` n'est
#     PAS concerné : `opendal-service-s3` ne tire que reqsign-aws-v4 + reqsign-core,
#     sans la dépendance `rsa` de ce dernier, qui n'est qu'une feature optionnelle
#     activée uniquement par `gcs`/`azure`.
#   L'ancien second chemin — rsa → sqlx-mysql → … → sqlx 0.8.6 → 8 crates du
#     workspace — est PÉRIMÉ : `sqlx` est sorti du graphe résolu dans son ensemble ;
#     il n'y a plus de chemin sqlx à invalider, il n'y a plus de sqlx du tout.
#
# Absence de correctif amont : advisory ouverte depuis 2023-11 avec `patched = []`,
# aucun `rsa` corrigé publié, aucune date annoncée. `cargo audit` rend
# « Solution: No fixed upgrade is available! ». Sans exemption, le gate resterait
# ROUGE indéfiniment — le « rouge normalisé » qu'une leçon du dépôt condamne : un
# job rouge permanent finit par masquer les rouges qui, eux, comptent.
#
# Condition de revisite (fait vérifiable, pas intention) — retirer cette entrée dès
# que L'UN de ces deux faits est vrai (le troisième critère historique — activation de
# la feature `mysql` de `sqlx` — a disparu avec sqlx lui-même, sorti du graphe résolu) :
#   1. un `rsa` corrigé (advisory `patched` non vide) paraît en amont ;
#   2. `cargo tree -i rsa --target all -e normal,build,dev` cesse de rendre
#      « error: package ID specification `rsa` did not match any packages » (rsa entre
#      dans le graphe résolu, p.ex. activation d'un backend cloud `gcs`/`azure` d'opendal).
# Dans ces cas, `cargo deny` partira rouge de lui-même : c'est le signal attendu.
[advisories]
ignore = ["RUSTSEC-2023-0071"]
