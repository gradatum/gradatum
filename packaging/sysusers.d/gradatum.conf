# Dedicated system account for the gradatum daemon.
# Created by systemd-sysusers at package-install time.
#
# UID/GID allocation is DYNAMIC ("-"): systemd-sysusers picks the first free
# system ID on the target host. This is the mode systemd itself recommends
# (man sysusers.d, ID field: automatic allocation is "strongly recommended
# unless it is strictly necessary to use a specific UID or GID").
#
# Why dynamic, and why it is inconsequential: nothing references this account by
# number. All four units (gradatum-server, gradatum-worker, gradatum-engine@,
# gradatum-gateway-spike) declare User=gradatum / Group=gradatum by NAME, which
# systemd resolves at runtime. A pinned number bought nothing and was actively
# harmful: it was chosen by scanning ID availability on a single reference host,
# then frozen for every installer. On a host where that GID is already taken
# (observed: forgejo-runner), systemd-sysusers does NOT fail — it creates the
# user, sees the numeric group already exists, and silently attaches the account
# to that foreign group instead of creating "gradatum". The install then dies
# later on `chown gradatum:gradatum` (invalid group), half-done.
#
# /var/lib/gradatum : home directory (config + keys + SQLite + states)
# /sbin/nologin      : interactive shell refused (daemon only)
u gradatum - "Gradatum service" /var/lib/gradatum /sbin/nologin
m gradatum gradatum
