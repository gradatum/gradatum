[workspace]
resolver = "3"
members = [
    # Umbrella SDK facade
    "crates/gradatum",

    # Data plane libraries (alphabetical)
    "crates/gradatum-acl-auth",
    "crates/gradatum-acl-policy",
    "crates/gradatum-auth",
    "crates/gradatum-cache",
    "crates/gradatum-chat",
    "crates/gradatum-core",
    "crates/gradatum-curator",
    "crates/gradatum-db-sqlite",
    "crates/gradatum-distill",
    "crates/gradatum-embed",
    "crates/gradatum-engine",
    "crates/gradatum-index",
    "crates/gradatum-markdown",
    "crates/gradatum-queue",
    "crates/gradatum-search",
    "crates/gradatum-storage",
    "crates/gradatum-vault",

    # Control plane binaries
    "crates/gradatum-admin",
    "crates/gradatum-server",
    "crates/gradatum-worker",

    # Clients
    "crates/gradatum-cli",
    "crates/gradatum-mcp-stub",
    "crates/gradatum-sdk-rs",

    # Test suites (publish = false)
    "crates/v1-parity-tests",
    "crates/index-parity-tests",

    # Benchmarks (Phase 1 baseline — publish = false)
    "crates/gradatum-bench",

    # Shared DTOs (wire contracts — single source of truth)
    "crates/gradatum-dto",

    # Network guard L0 (IP filter + rate limit + loopback bypass)
    "crates/gradatum-warden",

    # LLM Gateway service — unified LLM router + F-08 reranker
    "crates/gradatum-gateway",

    # Studio web UI — crate « bundle-only » : publiée, son artefact est le bundle Vite
    "crates/gradatum-studio",

    # Code-ingest pipeline : tree-sitter parse → notes dérivées index-only
    "crates/gradatum-ingest",
]

[workspace.package]
version = "2.1.0"
edition = "2024"
rust-version = "1.91"
authors = ["Gradatum Contributors"]
license = "Apache-2.0"
repository = "https://github.com/gradatum/gradatum"
homepage = "https://gradatum.org"
description = "Memory backbone for AI agents — graduated."
readme = "README.md"
keywords = ["memory", "agents", "knowledge-base", "markdown", "embedded"]
categories = ["database", "memory-management"]

[workspace.dependencies]
# Async runtime
# NOTE: versioned pins validated against Cargo.lock baseline (Phase 0bis-bis HEAD~0).
# serde 1.0.228 is the minimum compatible with toml_edit 0.25.x / toml 1.x.
# PR-6 Plan bumps: toml 0.8.23→1.1.2 + toml_edit 0.22.27→0.25.11 (MSRV 1.85).
tokio       = { version = "=1.53.0", features = ["full"] }
async-trait = "=0.1.91"

# Serialization
serde       = { version = "=1.0.229", features = ["derive"] }
serde_json  = "=1.0.150"
serde_norway = "=0.9.42"
serde_jcs   = "=0.1.0"
toml        = "=1.1.3"
toml_edit   = "=0.25.13"

# Errors
thiserror   = "=2.0.19"
# anyhow 1.0.103 : fix RUSTSEC-2026-0190 (unsound Error::downcast_mut sous Error::context).
anyhow      = "=1.0.104"

# Time + IDs
chrono      = { version = "=0.4.45", features = ["serde"] }
ulid        = { version = "=3.0.0", features = ["serde"] }

# Hashing
sha2        = "=0.11.0"

# Perf hints
smallvec    = { version = "=1.15.2", features = ["serde"] }

# Schema embedding
include_dir = "=0.7.4"

# Cache
moka        = { version = "=0.12.15", features = ["future"] }

# Database
# rusqlite =0.40.2 : montée F-145 (jalon 2.1.0, lot final). Le blocage historique
# qui épinglait 0.32.1 (sqlx 0.8 exigeait libsqlite3-sys ^0.30.1, inconciliable avec
# rusqlite 0.33+) a été LEVÉ le 2026-08-25 : sqlx est retiré du graphe de dépendances
# entier. La montée est décidée sur MESURE de performance (voir banc B11 et CHANGELOG
# section 2.1.0) — elle porte le bénéfice de la carte. Elle change la version du moteur
# SQLite embarqué (libsqlite3-sys 0.30.1 → 0.38.x) : version déclarée dans le CHANGELOG,
# jamais déduite du numéro de crate (test `sqlite_engine_version`).
rusqlite    = { version = "=0.40.2", features = ["bundled", "chrono"] }
dashmap     = "=6.2.1"
# ANN sqlite-vec extension (v0.5.3 ANN-1) — compile la static lib sqlite_vec0.
# default-features = false : évite de tirer rusqlite ^0.31 (dev-dep upstream) en conflit
# avec notre rusqlite =0.32.1 bundled. La static lib est liée via build.rs cc.
# L'enregistrement unsafe (sqlite3_auto_extension) reste dans les bin crates (server/worker)
# qui n'ont pas #![forbid(unsafe_code)].
sqlite-vec  = { version = "=0.1.9", default-features = false }

# Job queue — Apalis embedded (D-09 ARCH-D15 v0.2.0)
# Pin exact : D-09 BLOQUANT — toute version majeure/mineure/patch doit être actée council.
# apalis-cron rc.8 : rc.9 non publié sur crates.io (dernière version disponible = rc.8).
apalis         = { version = "=1.0.0-rc.9", default-features = false, features = ["tracing", "retry", "timeout", "limit", "catch-panic"] }
apalis-cron    = { version = "=1.0.0-rc.8" }

# Observability — Prometheus metrics (apalis prometheus feature + gradatum-worker telemetry)
prometheus        = { version = "=0.14.0", default-features = false }
# prometheus-client 0.25.0 — utilisé par gradatum-server + gradatum-engine (P0-3 : ajouté au workspace)
prometheus-client = "=0.25.0"

# HTTP server / client
axum        = "=0.8.9"
# Native TLS termination for [server.tls] (B-2). `tls-rustls-no-provider` keeps the
# crypto provider explicit: we install `aws_lc_rs` at boot (already in the graph via
# reqwest), avoiding a second `ring`-based rustls provider and the resulting
# ambiguous process-default provider panic.
axum-server = { version = "=0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
# rustls is a direct dep solely to install the process-default crypto provider at boot.
# Pinned to the version already resolved transitively (=0.23.43) to avoid duplicates.
rustls      = { version = "=0.23.40", default-features = false, features = ["aws_lc_rs", "logging", "std", "tls12"] }
http        = "=1.4.2"
tower       = "=0.5.3"
tower-http      = { version = "=0.7.0", features = ["cors", "trace", "fs", "set-header", "limit"] }
governor        = "=0.10.4"
reqwest     = { version = "=0.13.4", default-features = false, features = ["rustls", "json", "stream", "query"] }

# Storage abstraction
# 0.58.1 : premier palier exigeant quick-xml >= 0.41 (opendal-core), seuil de correction
# de RUSTSEC-2026-0194 / -0195. Depuis 0.56 la crate est éclatée (façade `opendal` +
# `opendal-core` + `opendal-service-*`). 0.58.0 était YANKED (bug ctor macOS, apache/opendal#7923) ;
# 0.58.1 publiée non yankée 2026-07-31. Emporte un relèvement MSRV workspace -> 1.91.
opendal     = { version = "=0.58.1", default-features = false }
# Transport HTTP enfichable d'OpenDAL 0.58 (apache/opendal#7900). Sans lui, tout backend
# objet (S3/GCS/Azure) échoue AVANT le premier paquet réseau sur `ConfigInvalid: default
# HTTP transport is not installed`. Variante `rustls-no-provider` DÉLIBÉRÉE : elle n'embarque
# aucun fournisseur crypto, elle lit le fournisseur process-default que nous installons
# explicitement (`aws_lc_rs`) — même précédent que `axum-server`/`tls-rustls-no-provider`,
# pour éviter qu'un second provider (`ring`) soit tiré et rende le défaut de process ambigu.
# `default-features = false` : miroir exact de la déclaration du même crate dans la façade
# `opendal` (elle-même `default-features = false`). Version épinglée sur le palier opendal.
opendal-http-transport-reqwest = { version = "=0.58.1", default-features = false, features = ["rustls-no-provider"] }

# Embeddings (CPU)
# default-features désactivé pour retirer ort-download-binaries (build-time TLS requis, absent sur ce CI).
# hf-hub-rustls-tls : téléchargement des fichiers de modèle depuis HuggingFace.
# Utilisé via feature flag `fastembed-cpu` uniquement dans gradatum-embed.
# Les tests FastEmbedCpu sont #[ignore] — ORT dylib non requis en CI.
# F-142 lot 3 (2026-08-08) : 4.6.0 -> 4.9.1, dans la même ligne majeure. La 5.x est
# délibérément écartée : elle épingle `ort =2.0.0-rc.13`, qui épingle à son tour
# `ort-sys =2.0.0-rc.13` — en conflit exact et non résoluble avec le pin indépendant
# `ort-sys = "=2.0.0-rc.9"` de `crates/gradatum-search` (feature `onnx-reranker`). La 5.x fait
# par ailleurs passer `embed` de `&self` à `&mut self`. La 4.9.1 épingle `ort` ET `ort-sys` en
# rc.9, identiques à nos pins : zéro conflit, et signature d'`embed` inchangée — aucune
# adaptation dans `gradatum-embed`.
fastembed   = { version = "=4.9.1", default-features = false, features = ["hf-hub-rustls-tls"] }
# PR-Z1 fix : ort-sys rc.12 (private mirror) utilise ureq v3 mais le proxy upstream sert ureq v2.
# Forcer ort-sys =2.0.0-rc.9 (ureq ^2.1 compatible) comme dep directe de gradatum-embed
# pour contraindre Cargo à choisir rc.9 plutôt que le rc.12 résolu via ^rc.9 d'ort.
ort-sys     = { version = "=2.0.0-rc.9" }

# Config loading (server config figment — T1)
figment     = { version = "=0.10.19", features = ["toml", "env"] }

# MCP
rmcp        = { version = "=1.6.0", features = ["server", "macros", "transport-streamable-http-server"] }

# Logging / observability
tracing             = "=0.1.44"
tracing-subscriber  = { version = "=0.3.23", features = ["env-filter", "json"] }

# Utilities
clap        = { version = "=4.6.2", features = ["derive"] }
walkdir     = "=2.5.0"
regex       = "=1.13.1"
once_cell   = "=1.21.4"
globset     = "=0.4.19"
strsim      = "=0.11.1"
unicode-segmentation = "=1.13.3"

# Stability annotations (AM1 — storage-traits unstable tags Étape 0.1+)
# Version 0.2.1 — MSRV 1.60, compatible MSRV workspace 1.85.
stability   = "0.2"

# Secrets — zeroize-on-drop pour les credentials LLM (backends P2.0b)
secrecy     = "=0.10.3"
subtle      = "2"
zeroize     = { version = "=1.9.0", features = ["derive"] }

# Crypto / auth
argon2      = "=0.5.3"
rand        = "=0.8.6"
ed25519-dalek = { version = "=2.1.1", features = ["pkcs8", "rand_core", "pem", "zeroize"] }
jsonwebtoken  = { version = "=9.3.1", default-features = false }
# PR-5 NOTE : jsonwebtoken 10.x nécessite feature rust_crypto (sha2 ^0.10.7) — incompatible
# avec sha2 =0.11.0 déjà bumpé dans cette PR. Migration 9→10 reportée à PR-6/TOML ou PR-X dédié.
pkcs8         = "=0.10.2"

# UNIX syscalls (statfs NFS check — caveat C11; signal: SIGTERM smoke test)
# "user" (F-191) : gradatum-engine --check résout l'identité (uid/gid/groupes) du
# `User=` de l'unité systemd qui servira la configuration, au lieu de juger pour l'uid
# du processus appelant. Module de bindings libc purs — aucune dépendance transitive.
nix         = { version = "=0.31.3", features = ["fs", "signal", "process", "user"] }

# Tests
tempfile    = "=3.27.0"
proptest    = "=1.11.0"
serde_test  = "=1.0.177"
wiremock    = "=0.6.5"
mockito     = "=1.7.2"
futures     = "=0.3.33"
insta       = { version = "=1.48.0", features = ["json"] }

# Bench
criterion   = "=0.8.2"

# Cross-crate — version= obligatoire pour cargo publish (crates.io refuse les path-only)
# Toutes ces crates héritent `version.workspace = true` : la valeur déclarée ici doit
# rester alignée sur `workspace.package.version`.
gradatum = { path = "crates/gradatum", version = "2.1.0" }
gradatum-dto = { path = "crates/gradatum-dto", version = "2.1.0" }
gradatum-warden = { path = "crates/gradatum-warden", version = "2.1.0" }
schemars = { version = "=1.2.1", features = ["derive"] }
gradatum-acl-auth = { path = "crates/gradatum-acl-auth", version = "2.1.0" }
gradatum-acl-policy = { path = "crates/gradatum-acl-policy", version = "2.1.0" }
gradatum-auth = { path = "crates/gradatum-auth", version = "2.1.0" }
gradatum-cache = { path = "crates/gradatum-cache", version = "2.1.0" }
gradatum-chat = { path = "crates/gradatum-chat", version = "2.1.0" }
gradatum-core = { path = "crates/gradatum-core", version = "2.1.0" }
gradatum-curator = { path = "crates/gradatum-curator", version = "2.1.0" }
gradatum-embed = { path = "crates/gradatum-embed", version = "2.1.0" }
gradatum-engine = { path = "crates/gradatum-engine", version = "2.1.0" }
gradatum-index = { path = "crates/gradatum-index", version = "2.1.0" }
gradatum-markdown = { path = "crates/gradatum-markdown", version = "2.1.0" }
gradatum-queue = { path = "crates/gradatum-queue", version = "2.1.0" }
gradatum-search = { path = "crates/gradatum-search", version = "2.1.0" }
# DIVERGENCE VOULUE — NE PAS aligner cette ligne sur la version du workspace.
# `gradatum-sdk-rs` porte `publish = false` depuis 2.1.0 : sa 2.1.0 n'existera JAMAIS
# sur crates.io. Or `gradatum` la déclare en dépendance optionnelle (feature `client`),
# et crates.io exige que toute dépendance déclarée — optionnelle comprise — soit
# résolvable au registre. La hausser à "2.1.0" rendrait donc `gradatum` IMPUBLIABLE.
# La borne reste "2.0.0" parce que gradatum-sdk-rs 2.0.0 est réellement publié (dernière
# version où la crate était publiable). Vérifié par l'API crates.io le 2026-08-29.
# Le gate « requirements intra-famille » de scripts/internal/publish-crates-io-v2.1.0.sh
# classe cette ligne en NOTE, jamais en violation — c'est voulu, pas un oubli.
# Pour la réaligner un jour il faut D'ABORD trancher le sort de la feature `client`
# (retrait, ou republication de gradatum-sdk-rs).
gradatum-sdk-rs = { path = "crates/gradatum-sdk-rs", version = "2.0.0" }
gradatum-storage = { path = "crates/gradatum-storage", version = "2.1.0" }
gradatum-vault = { path = "crates/gradatum-vault", version = "2.1.0" }
gradatum-worker = { path = "crates/gradatum-worker", version = "2.1.0" }
gradatum-db-sqlite = { path = "crates/gradatum-db-sqlite", version = "2.1.0" }
gradatum-distill = { path = "crates/gradatum-distill", version = "2.1.0" }
gradatum-gateway = { path = "crates/gradatum-gateway", version = "2.1.0" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
