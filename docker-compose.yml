# ============================================================================
# Gradatum Docker deployment (server + worker + local inference + one-shot init).
#
# Verified end to end against a live Docker daemon (VPS CA-1, 2026-08-12,
# repo @ 482fcaa4) in two commands — gradatum-init sits behind the `init` profile,
# so a plain `up` never starts it:
#   1. `docker compose --profile init up gradatum-init`  → the one-shot init
#      runs to completion (exit 0);
#   2. `docker compose up -d gradatum-server gradatum-worker llama-embed
#      llama-chat` (the default stack — every service without a profile) → all
#      four reach healthy.
# A note written via the API then reads back identical, and the curator processes
# it through the LLM review path
# (gradatum_curator_decisions_total{path="llm_review"}). Re-verify if the
# service topology, ports or config template below change.
#
# ── What the DEFAULT stack is (no profile flag needed) ───────────────────────
# `docker compose up` starts the operational minimum: gradatum-server,
# gradatum-worker AND the two local inference services (llama-embed on :8436,
# llama-chat on :8000). Embedding and curation are the value functions of the
# product; the server and worker are only their container. The freshly-init'd
# config ships `[embed] enabled = true → http://localhost:8436` — so the
# embedder MUST be served by default, otherwise every note write fires an embed
# job at a dead port (5 s timeout) while /health stays green. That silent
# void is the exact failure this default cures.
#
# Prerequisite: the model weights must be present under ./models/embed and
# ./models/chat BEFORE `up` (the bind mounts are read-only). Fetch them with
# `bash scripts/fetch-models.sh` (pinned HF revision + sha256, never rehosted).
# scripts/quickstart-docker.sh does this for you.
#
# ── Running server + worker WITHOUT the bundled inference (explicit) ──────────
# To bring the two gradatum services up on their own (e.g. you point [embed] /
# [curator.llm] at your own endpoints), skip the dependency graph explicitly:
#   docker compose up -d --no-deps gradatum-server gradatum-worker
# `--no-deps` is the documented escape hatch; a plain `up` pulls in llama-embed
# because the worker depends on it (see gradatum-worker.depends_on).
#
# gradatum-gateway, gradatum-engine and gradatum-init keep their profiles and
# stay opt-in (gateway / engine / init).
#
# Design constraints baked into this file:
#   1. Loopback-only bind. gradatum-server refuses to start on a non-loopback
#      address unless TLS is configured (fail-closed, see
#      crates/gradatum-server/src/config.rs `validate_bind_tls`). This quickstart
#      is cleartext HTTP, so the server binds 127.0.0.1 and the containers use
#      `network_mode: host`: the server is reachable at the host's own
#      127.0.0.1:19090 (Studio + /health), and a bridge published port — which
#      cannot forward to a loopback-bound process — is not needed. To expose the
#      server beyond localhost, configure [server.tls] and switch to a
#      non-loopback bind.
#   2. Single root. `gradatum-admin init` writes everything (db, config,
#      server.toml) under one --root. Server and worker therefore read the
#      config init actually produced: /var/lib/gradatum/config/server.toml on the
#      shared `gradatum-state` volume (NOT /etc/gradatum, which init never fills).
#   3. Internal token. The worker reaches the server's internal API (127.0.0.1:19092)
#      via GRADATUM_INTERNAL_TOKEN; the server receives the SAME secret through
#      GRADATUM_INTERNAL_API__TOKEN (figment env mapping). Never hard-code it:
#      ${GRADATUM_INTERNAL_TOKEN:?...} forces it to be supplied at startup.
#   4. llama healthcheck override. The ghcr.io/ggml-org/llama.cpp:server image
#      probes :8080 by default; the healthchecks below target the real ports
#      (8436 embedding, 8000 chat).
#
# Security: all listeners bind loopback (127.0.0.1). No unprotected public port.
# Secrets only via environment variables or mounted files, never inline.
# ============================================================================

name: gradatum

services:
  # ── Main server ──────────────────────────────────────────────────────────
  gradatum-server:
    build: .
    container_name: gradatum-server
    restart: unless-stopped
    # Host networking: the server binds 127.0.0.1 (fail-closed refuses a
    # non-loopback bind without TLS), so it must share the host's network
    # namespace to be reachable at 127.0.0.1:19090 from the host. This replaces a
    # bridge published port, which cannot forward to a loopback-bound process.
    network_mode: host
    volumes:
      - gradatum-state:/var/lib/gradatum
      - gradatum-audit:/var/log/gradatum
    environment:
      - RUST_BACKTRACE=1
      # Internal-API worker token. Figment maps env with the GRADATUM_ prefix and `__`
      # as the section separator, so `internal_api.token` ← GRADATUM_INTERNAL_API__TOKEN
      # (cf. crates/gradatum-server/src/config.rs: Env::prefixed("GRADATUM_").split("__")).
      # This env value overrides server.toml and MUST equal the worker's
      # GRADATUM_INTERNAL_TOKEN below — otherwise the server's internal listener and the
      # worker authenticate against different secrets and every internal call 401s.
      # Without it the server never spawns the :19092 listener and the worker is inert.
      - GRADATUM_INTERNAL_API__TOKEN=${GRADATUM_INTERNAL_TOKEN:?GRADATUM_INTERNAL_TOKEN required — provide via .env or export}
    # Reads the config init actually wrote (single --root, on gradatum-state).
    command: ["--config", "/var/lib/gradatum/config/server.toml"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:19090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ── Worker (curation, embedding, distillation) ───────────────────────────
  gradatum-worker:
    build: .
    container_name: gradatum-worker
    restart: unless-stopped
    # The worker calls the server's internal API on loopback (127.0.0.1:19092),
    # so it shares the host network namespace with the server (which also uses
    # network_mode: host). Same reachability, no bridge port needed.
    network_mode: host
    depends_on:
      gradatum-server:
        condition: service_healthy
      # The worker is the ONLY consumer of the embedder: the default config's
      # [embed] endpoint (http://localhost:8436) is called from here, not from
      # the server. Gating on service_healthy (not service_started) means the
      # worker waits until the model is actually loaded and /health returns 200,
      # so the very first embed job hits a live endpoint instead of a loading
      # server. Fail-closed on the value path: no silent 5 s timeouts into a
      # port that is only "started".
      llama-embed:
        condition: service_healthy
      # Symmetric to llama-embed: a freshly-init'd server.toml now emits an ACTIVE
      # [curator] backend = "openai_compat" + [curator.llm] base_url =
      # "http://localhost:8000" section (see init.rs generate_server_toml_template),
      # so the worker's curator calls the chat model at :8000. Gating on
      # service_healthy (not service_started) makes the first curate job hit a loaded
      # model instead of a still-loading server — fail-closed on the value path, no
      # silent timeouts into a port that is only "started".
      llama-chat:
        condition: service_healthy
    volumes:
      - gradatum-state:/var/lib/gradatum
      - gradatum-audit:/var/log/gradatum
    entrypoint: ["/usr/local/bin/gradatum-worker"]
    # Same config file the server reads (written by init under --root).
    command: ["--config", "/var/lib/gradatum/config/server.toml"]
    environment:
      - GRADATUM_INTERNAL_URL=http://127.0.0.1:19092
      - GRADATUM_INTERNAL_TOKEN=${GRADATUM_INTERNAL_TOKEN:?GRADATUM_INTERNAL_TOKEN required — provide via .env or export}

  # ── Initialization (one-shot) ────────────────────────────────────────────
  # Usage: docker compose --profile init up gradatum-init
  gradatum-init:
    build: .
    container_name: gradatum-init
    volumes:
      - gradatum-state:/var/lib/gradatum
    entrypoint: ["/usr/local/bin/gradatum-admin"]
    # Loopback bind: gradatum-server refuses a non-loopback bind without TLS
    # (validate_bind_tls). Writes to /var/lib/gradatum (the volume the server reads).
    command: ["init", "--root", "/var/lib/gradatum", "--bind", "127.0.0.1:19090", "--non-interactive"]
    profiles: ["init"]

  # ── LLM gateway (multi-provider proxy, optional) ─────────────────────────
  # The gateway is an LLM proxy with circuit-breaker, cross-encoder reranking and
  # supervisor-engine integration. Expected config:
  #   /etc/gradatum/gateway.toml — provider endpoints, API keys, reranking
  #   (mount the config file into gradatum-config; init does not create it).
  # Default gateway port: 19091. NOTE: the server's metrics listener also uses
  # 127.0.0.1:19091 — do not run both on the same host without changing one.
  gradatum-gateway:
    build: .
    container_name: gradatum-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:19091:19091"
    volumes:
      - gradatum-config:/etc/gradatum:ro
      - gradatum-state:/var/lib/gradatum
    entrypoint: ["/usr/local/bin/gradatum-gateway"]
    command: ["--config", "/etc/gradatum/gateway.toml"]
    profiles: ["gateway"]

  # ── Engine runtime (llama-server supervisor, optional) ───────────────────
  # The engine starts and supervises a llama-server child process. In Docker,
  # prefer the dedicated llama-embed / llama-chat containers (default services,
  # no profile) over embedding llama-server inside the engine.
  #
  # Expected config: /etc/gradatum/engine.toml (single file, [engine] format).
  # Sample configs to adapt: examples/configs/engine-chat.toml
  #                          examples/configs/engine-embed.toml
  # Full docs: docs/DEPLOYMENT.md §4-§5 + crates/gradatum-engine/src/config.rs
  gradatum-engine:
    build: .
    container_name: gradatum-engine
    restart: unless-stopped
    ports:
      - "127.0.0.1:19093:19093"
    volumes:
      - gradatum-config:/etc/gradatum:ro
      - gradatum-state:/var/lib/gradatum
    entrypoint: ["/usr/local/bin/gradatum-engine"]
    # gradatum-engine takes the config path as a POSITIONAL argument (args[1]),
    # NOT a --config flag (crates/gradatum-engine/src/bin/gradatum-engine.rs).
    command: ["/etc/gradatum/engine.toml"]
    profiles: ["engine"]

  # ── Local CPU LLM — embedding (DEFAULT — part of the operational minimum) ──
  # CPU only, no GPU. Serves [embed] in the gradatum config, which is enabled by
  # default and points at http://localhost:8436. Started by a plain
  # `docker compose up`; the worker depends on it (service_healthy).
  # Model: BGE-M3 Q8_0, 1024 dimensions (~0.6 GB on disk, ~1.5 GB RAM).
  # Fetch it first: bash scripts/fetch-models.sh   (writes ./models/embed/).
  # Loopback port only.
  llama-embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gradatum-llama-embed
    restart: unless-stopped
    ports:
      - "127.0.0.1:8436:8436"
    volumes:
      # Adjust the path to your models directory:
      - ./models/embed:/models:ro
    healthcheck:
      # Mandatory override: the image probes :8080 by default
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8436/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8436"
      - --model
      - /models/bge-m3-q8_0.gguf
      - --alias
      - bge-m3-Q8_0
      - --embedding
      - --ctx-size
      - "512"
      - --threads
      - "2"
      - --threads-batch
      - "4"

  # ── Local CPU LLM — chat / curator (DEFAULT — part of the operational minimum)
  # CPU only, no GPU. Serves the curator's classification LLM at :8000.
  # Model: Qwen3-4B-Instruct-2507, Unsloth Dynamic UD-Q4_K_XL (~2.4 GB on disk).
  # The Instruct variant is REQUIRED — a base model does not follow the
  # classification instruction. Fetch it first: bash scripts/fetch-models.sh
  # (writes ./models/chat/). Loopback port only.
  #
  # Started by a plain `docker compose up` AND consumed by default: a freshly-init'd
  # server.toml emits [curator.llm] base_url = "http://localhost:8000" model =
  # "Qwen3-4B-Instruct-2507", and the worker gates on this service's health
  # (gradatum-worker depends_on). The alias below MUST match that model name.
  llama-chat:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: gradatum-llama-chat
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # Adjust the path to your models directory:
      - ./models/chat:/models:ro
    healthcheck:
      # Mandatory override: the image probes :8080 by default
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    command:
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --model
      - /models/Qwen3-4B-Instruct-2507-UD-Q4_K_XL.gguf
      - --alias
      - Qwen3-4B-Instruct-2507
      - --ctx-size
      - "4096"
      # Pin a single decode slot: with the default auto layout (-1) llama.cpp splits the
      # 4096-token unified KV cache across ~4 slots. The curate worker runs serial
      # (concurrency 1), so a single full-context slot matches the workload and keeps the
      # per-request context window whole. Do NOT raise --ctx-size here: that would bake this
      # machine's sizing into every install.
      - --parallel
      - "1"
      - --threads
      - "6"

volumes:
  gradatum-config:
  gradatum-state:
  gradatum-audit:
