[package]
name = "gradatum-mcp-stub"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Adapter MCP stdio → HTTP gradatum-server (thin proxy)"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gradatum-mcp-stub"
path = "src/main.rs"

[dependencies]
gradatum-dto = { workspace = true, features = ["schemars"] }
schemars.workspace = true
# rmcp avec feature transport-io (stdio) en plus du workspace "server"+"macros"
rmcp = { version = "=1.6.0", features = ["server", "macros", "transport-io"] }
reqwest.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
wiremock = { workspace = true }
