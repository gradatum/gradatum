[package]
name = "gradatum-vault"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Multi-vault registry + lifecycle (create/list/swap/delete) + forward-compat"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Ne jamais empaqueter les tests d'intégration : ils ne compilent pas chez le
# consommateur, alourdissent le package et sont un vecteur récurrent de fuite
# (marqueurs PII/fixtures). Cf. bloquant publish v1.0.0.
exclude = ["tests/**"]

[dependencies]
gradatum-core.workspace = true
gradatum-markdown.workspace = true
gradatum-cache.workspace = true
gradatum-index.workspace = true
gradatum-storage.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
chrono.workspace = true
ulid.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true

[features]
# Backend objet S3 pour le stockage des notes — opt-in, forwarde vers gradatum-storage.
# Aucun défaut ici : les binaires consommateurs décident de l'embarquer (cf. serveur).
s3 = ["gradatum-storage/s3"]

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["full"] }
