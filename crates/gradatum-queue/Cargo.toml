[package]
name = "gradatum-queue"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite-backed jobs queue with atomic UPDATE...RETURNING leases"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
gradatum-core      = { path = "../gradatum-core", version = "2.5.0" }
# gradatum-db-sqlite is publishable (no `publish` key); this dependency does not block
# publication of gradatum-queue.
gradatum-db-sqlite = { path = "../gradatum-db-sqlite", version = "2.5.0" }
# P2.0b dependencies (rusqlite-based async Queue trait + SqliteQueue)
async-trait   = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
ulid          = { workspace = true }
# Phase 1 legacy (rusqlite-based LegacyQueue struct)
rusqlite      = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["full", "test-util"] }
# `trace` (dev-only) : `get_many_delegates_one_batched_read_for_n_ids` compte les
# statements SQL de la connexion partagée — la façade détient un `SqliteQueueStore`
# concret, aucun double de `QueueStore` ne peut s'intercaler pour compter les appels.
rusqlite      = { workspace = true, features = ["trace"] }
