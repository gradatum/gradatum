[package]
name = "gradatum-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Async queue consumer — curator LLM + maintenance jobs"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "gradatum-worker"
path = "src/main.rs"

[lib]
name = "gradatum_worker"
path = "src/lib.rs"

[dependencies]
gradatum-core.workspace = true
gradatum-dto.workspace = true
# gradatum-db-sqlite is publishable (no `publish` key); this dependency does not block
# publication of gradatum-worker.
gradatum-db-sqlite      = { path = "../gradatum-db-sqlite", version = "2.0.0" }
gradatum-embed.workspace = true
gradatum-queue.workspace = true
gradatum-curator.workspace = true
async-trait.workspace = true
anyhow.workspace = true
serde_json.workspace = true
smallvec.workspace = true
clap = { workspace = true, features = ["derive"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
tokio = { workspace = true, features = ["full", "signal"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }
ulid.workspace = true
chrono.workspace = true
figment.workspace = true
serde.workspace = true
apalis       = { workspace = true }
apalis-cron  = { workspace = true }
prometheus   = { workspace = true }
axum         = { workspace = true, features = [] }
tower        = { workspace = true }
futures      = { workspace = true }
# cron 0.16.0 : dep transitive d'apalis-cron — nécessaire pour Schedule::from_str
# dans monitor.rs + schedules.rs.
cron         = "=0.16.0"
toml.workspace = true
reqwest.workspace = true
secrecy.workspace = true

[dev-dependencies]
tempfile.workspace = true
smallvec.workspace = true
async-trait.workspace = true
# Tests d'intégration worker_repoll : drive un VRAI Monitor Apalis (non-régression
# worker-hang). apalis/futures/sqlx/tokio/gradatum-* sont déjà des deps non-dev,
# re-déclarées ici pour être visibles depuis tests/.
apalis        = { workspace = true }
futures       = { workspace = true }
gradatum-core.workspace = true
# gradatum-index et gradatum-vault : uniquement utilisés par les modules dead_code
# (dispatch.rs, curator_loader.rs, leader.rs) et les tests d'intégration.
# Non utilisés par le binaire de prod (worker-flip v0.5.3 : toutes les mutations
# passent par InternalClient HTTP). Déplacés en dev-dependencies (P2 audit).
gradatum-index.workspace = true
gradatum-vault.workspace = true
# gradatum-admin (dev-only): producer of the init server.toml template. The curator-default
# integration test drives the REAL producer (generate_server_toml_template) into the REAL
# worker loader (curator_loader::build_curator_pipeline), proving the produced default config
# enters LLM mode rather than heuristic. Acyclic: gradatum-admin does not depend on the worker.
gradatum-admin = { path = "../gradatum-admin" }
tokio = { workspace = true, features = ["full"] }
sqlx = { workspace = true, features = ["sqlite", "runtime-tokio"] }
ulid.workspace = true
chrono.workspace = true
walkdir.workspace = true
regex.workspace = true
