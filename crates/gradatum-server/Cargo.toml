[package]
name = "gradatum-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Stateless HTTP/MCP facade for gradatum — handles read/search + enqueues writes"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
# Ne jamais empaqueter les tests d'intégration : ils ne compilent pas chez le
# consommateur, alourdissent le package et sont un vecteur récurrent de fuite
# (marqueurs PII/fixtures). Cf. bloquant publish v1.0.0.
exclude = ["tests/**"]

[[bin]]
name = "gradatum-server"
path = "src/main.rs"

[lib]
name = "gradatum_server"
path = "src/lib.rs"

[dependencies]
gradatum-core.workspace = true
gradatum-dto = { workspace = true, features = ["schemars"] }
rusqlite.workspace = true
gradatum-embed.workspace = true
gradatum-vault.workspace = true
gradatum-index = { workspace = true, features = ["sqlite-vec-ann"] }
gradatum-search.workspace = true
gradatum-queue.workspace = true
gradatum-db-sqlite = { path = "../gradatum-db-sqlite", version = "1.0.0" }
gradatum-acl-policy.workspace = true
gradatum-acl-auth.workspace = true
gradatum-auth.workspace = true
gradatum-curator.workspace = true
axum.workspace = true
axum-server.workspace = true
rustls.workspace = true
tower.workspace = true
tower-http.workspace = true
gradatum-warden.workspace = true
rmcp.workspace = true
schemars.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
figment.workspace = true
clap.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
prometheus-client.workspace = true
bincode.workspace = true
sqlx.workspace = true
ulid.workspace = true
async-trait.workspace = true
secrecy.workspace     = true
smallvec.workspace    = true
toml.workspace        = true
subtle.workspace      = true
http.workspace = true
tokio-stream = { version = "=0.1.18", features = ["sync"] }
# CancellationToken (tokio_util::sync) pour shutdown graceful du StreamableHttpService rmcp.
# Version épinglée = version déjà résolue transitivement par rmcp (Cargo.lock 0.7.18).
# Pas de feature "sync" dans 0.7.x — le module sync est disponible sans feature gate.
tokio-util   = { version = "=0.7.18" }
# ANN sqlite-vec — enregistrement de l'extension (unsafe dans vec_ext.rs).
# Feature sqlite-vec-ann activée pour que SqliteIndex compile avec le module sqlite_vec.
sqlite-vec = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"
async-trait.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true
nix.workspace = true
gradatum-worker.workspace = true
gradatum-curator.workspace = true
secrecy.workspace = true
toml.workspace = true
http-body-util = "0.1"
insta.workspace = true
