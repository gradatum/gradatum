[package]
name = "gradatum-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "LLM proxy gateway — multi-provider routing with circuit-breaker, cross-encoder reranking, and engine supervisor integration"
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Pas de passe-plat `fastembed-cpu` ici : aucun code de ce crate ne construit
# `FastEmbedCpu` (il ne consomme que `dyn Embedder`, injecté par l'appelant).
# Le raccourci coûtait ~300 Mo de runtime ONNX sans rien câbler. Un consommateur
# qui veut ce backend active `gradatum-embed/fastembed-cpu` directement.

[dependencies]
# Workspace crates
gradatum-core    = { workspace = true }
gradatum-embed   = { workspace = true }
gradatum-search  = { workspace = true }

# Async runtime
tokio            = { workspace = true }
async-trait      = { workspace = true }

# Serialization
serde            = { workspace = true }
serde_json       = { workspace = true }
toml             = { workspace = true }

# HTTP server / client
axum             = { workspace = true }
http             = { workspace = true }
tower            = { workspace = true }
tower-http       = { workspace = true }
reqwest          = { workspace = true }

# Config loading
figment          = { workspace = true }

# Database
rusqlite         = { workspace = true }

# Errors
thiserror        = { workspace = true }
anyhow           = { workspace = true }

# Observability
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }

# Time + IDs
chrono           = { workspace = true }
ulid             = { workspace = true }

# Secrets
secrecy          = { workspace = true }

# Util
once_cell        = { workspace = true }
futures          = { workspace = true }

# Timing constant-time compare (bearerauth)
subtle           = { workspace = true }

# Bytes streaming
bytes            = "1"

[dev-dependencies]
tokio            = { workspace = true, features = ["full"] }
tempfile         = { workspace = true }
wiremock         = { workspace = true }
tower            = { workspace = true }
