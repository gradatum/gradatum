[package]
name = "gradatum-db-sqlite"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite implementations: QueueStore, IndexStore, MarkdownStore (gradatum-db-sqlite)"
publish = false  # Implémentation interne — non publiée sur crates.io

[dependencies]
gradatum-core = { path = "../gradatum-core" }

async-trait   = { workspace = true }
chrono        = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
sqlx          = { workspace = true, features = ["sqlite", "runtime-tokio", "macros", "chrono"] }
thiserror     = { workspace = true }
tokio         = { workspace = true }
tracing       = { workspace = true }
ulid          = { workspace = true }

[dev-dependencies]
tempfile      = { workspace = true }
tokio         = { workspace = true, features = ["full", "test-util"] }
