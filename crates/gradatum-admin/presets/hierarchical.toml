# Gradatum preset — hierarchical
#
# Pattern: human + main agent + typed sub-agents (writers / validators / experts).
# Mirrors a typical multi-agent pipeline (orchestrator + specialized sub-agents).
#
# Apply with:
#   gradatum-admin init --preset=hierarchical
#
# This preset takes no --projects: it carries no template placeholder, so scope it
# per project by adding a concrete [[consumer]] block per project (the example is
# below), not with --projects.
#
# This preset declares concrete consumers only: every identity below is one the
# engine evaluates as written. `init` substitutes only what it is given a value
# for (`--projects`), so a preset may not carry a placeholder nothing resolves —
# see the `acl validate` guard in the admin CLI and the materialization step in
# `init`, which refuses to write a preset whose values still hold a token.
#
# ACL pattern syntax (globset):
#   "*"                    match all loci
#   "projecta/*"           match all loci under "projecta/"
#   "*/briefing"           match any "X/briefing" locus
#   "!**/personal-classified" exclude the "personal-classified" segment (negation)

# ─── Human admin (top of hierarchy) ───────────────────────────────────
# identity="admin" — administrator, full vault access, sees personal-classified.
[[consumer]]
identity = "admin"
description = "Administrator — full vault read/write, sees personal-classified"
read_patterns  = ["**"]
write_patterns = ["**"]

# ─── Human operator: the studio UI ────────────────────────────────────
# identity="studio" — GRADATUM_STUDIO_APIKEY bearer, full access including
# personal-classified.
[[consumer]]
identity = "studio"
description = "Studio UI — full vault read/write, sees personal-classified"
read_patterns  = ["**"]
write_patterns = ["**"]

# ─── Main agent (orchestrator) ────────────────────────────────────────
# identity="main-agent" — LLM orchestrator, global access except personal-classified.
# Caveat B3: the denial of "personal-classified" is expressed as segment-scoped `!`
# negations at the head of read_patterns/write_patterns (deny-wins), no longer by a
# dedicated flag — it refuses the "personal-classified" segment, not any substring.
[[consumer]]
identity = "main-agent"
description = "Orchestrator (any LLM-based agent) — sees everything except personal-classified, writes briefings"
read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]
write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]


# ─── Project-scoped sub-agents: add one [[consumer]] per role ─────────
#
# There is no template block here on purpose. The engine reads `[[consumer]]`
# only, so a `[[consumer-template]]` block would reach a deployed bearer.toml as
# inert text carrying placeholders nothing resolves — the file would promise
# project-scoped identities that never exist, and name a project literally after
# the placeholder. A project-scoped consumer is therefore written out concrete,
# one per project, as below (writer: reads briefings + its own locus; validator:
# cross-reads the project, writes its findings).
#
# Each identity gets a freshly generated argon2id token_hash, displayed once in
# cleartext at init for distribution to consumers. Mint a key per identity with
# `gradatum-admin api-key create`.
#
# Example for two projects, projecta and projectb:
#
#   [[consumer]]
#   identity = "projecta-backend"
#   description = "Writer sub-agent — writes only its own locus, reads briefings + own work"
#   read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "main-agent", "projecta/briefing", "projecta/backend"]
#   write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "projecta/backend"]
#
#   [[consumer]]
#   identity = "projecta-tester"
#   description = "Validator sub-agent — cross-reads project for audit, writes own findings"
#   read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "main-agent", "projecta/*"]
#   write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "projecta/tester"]

# ─── Domain experts (thematic, read-only by default) ──────────────────
# Thematic experts scoped to the whole vault, read-only (write_patterns empty).
# Map these roles to whatever domain specialists an installation runs.

# expert-prompt — prompt engineering, terminology coherence
[[consumer]]
identity = "expert-prompt"
description = "Domain expert — prompt engineering, terminology coherence"
read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]
write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**"]

