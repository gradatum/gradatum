# ─── Engine (gradatum-engine — event-log writer) ──────────────────────
# identity="engine" — internal service shared by gradatum-engine curator + embed,
# write only on the main tenant's event-log. No vault locus.
# The read patterns are negations only, and that is deliberate: this consumer reads
# nothing. `gradatum-admin acl validate` therefore reports it as holding no positive
# read pattern — the expected output for a write-only consumer, not a misconfiguration.
[[consumer]]
identity = "engine"
description = "gradatum-engine service (curator + embed) — POST /api/v1/event-log"
read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**"]
write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "main/event-log"]

# ─── Example agent wrappers ───────────────────────────────────────────
# Illustrative consumers — one active key per identity. Replace these with the
# concrete agent wrappers an installation runs.

[[consumer]]
identity = "agent-wrapper"
description = "Local agent wrapper — full read/write except personal-classified"
read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]
write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]

[[consumer]]
identity = "third-party-agent"
description = "Third-party agent wrapper — same rights as the orchestrator"
read_patterns  = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]
write_patterns = ["!personal-classified", "!personal-classified/**", "!**/personal-classified", "!**/personal-classified/**", "**"]
