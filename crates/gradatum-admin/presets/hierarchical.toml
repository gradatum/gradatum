# Gradatum preset — hierarchical
#
# Pattern: human + main agent + typed sub-agents (writers / validators / experts).
# Mirrors a typical multi-agent pipeline (orchestrator + specialized sub-agents).
#
# Apply with:
#   gradatum-admin init --preset=hierarchical --projects=projecta,projectb
#
# The init command materializes consumer-templates into concrete consumers,
# substituting ${PROJECT}, ${AGENT}, ${THEME} based on --projects flags.
#
# ACL pattern syntax (globset):
#   "*"                   match all loci
#   "projecta/*"          match all loci under "projecta/"
#   "*/briefing"          match any "X/briefing" locus
#   "!personal-classified" exclude (negation)
#   "${VAR}"              variable substituted at init time

# ─── Human admin (top of hierarchy) ───────────────────────────────────
# identity="admin" — administrator, full vault access, sees personal-classified.
[[consumer]]
identity = "admin"
description = "Administrator — full vault read/write, sees personal-classified"
read_patterns  = ["**"]
write_patterns = ["**"]
sees_personal_classified = true

# ─── Human operator: the studio UI ────────────────────────────────────
# identity="studio" — GRADATUM_STUDIO_APIKEY bearer, full access including
# personal-classified.
[[consumer]]
identity = "studio"
description = "Studio UI — full vault read/write, sees personal-classified"
read_patterns  = ["**"]
write_patterns = ["**"]
sees_personal_classified = true

# ─── Main agent (orchestrator) ────────────────────────────────────────
# identity="main-agent" — LLM orchestrator, global access except personal-classified.
# Caveat B3: sees_personal_classified=false → short-circuits DenyExplicit on any locus
# containing "personal-classified", before pattern evaluation.
[[consumer]]
identity = "main-agent"
description = "Orchestrator (any LLM-based agent) — sees everything except personal-classified, writes briefings"
read_patterns  = ["**"]
write_patterns = ["**"]
sees_personal_classified = false


# ─── Sub-agent template: writers (coder agents, prompt-engineer, etc.) ──
[[consumer-template]]
id = "sub-agent-writer"
description = "Writer sub-agent — writes only its own locus, reads briefings + own work"
read_patterns = ["main-agent", "${PROJECT}/briefing", "${PROJECT}/${AGENT}"]
write_patterns = ["${PROJECT}/${AGENT}"]

# ─── Sub-agent template: validators (tester, reviewer, security expert) ─
[[consumer-template]]
id = "sub-agent-validator"
description = "Validator sub-agent — cross-reads project for audit, writes own findings"
read_patterns = ["main-agent", "${PROJECT}/*"]
write_patterns = ["${PROJECT}/${AGENT}"]

# ─── Expert template (domain specialists, monitoring) ────────────────
[[consumer-template]]
id = "expert"
description = "Thematic expert — reads main-agent + their theme scope, writes findings"
read_patterns = ["main-agent", "${THEME}/*"]
write_patterns = ["${THEME}/${AGENT}"]

# ─── Comments ──────────────────────────────────────────────────────────
#
# After init, the resulting bearer.toml will have one [[consumer]] block per
# (project × agent) pair derived from --projects and standard agent names.
#
# Example expansion for --projects=projecta,projectb with default agents:
#
#   [[consumer]] id = "projecta-backend"          (writer template)
#   [[consumer]] id = "projecta-frontend"         (writer template)
#   [[consumer]] id = "projecta-tester"           (validator template)
#   [[consumer]] id = "projecta-reviewer"          (validator template)
#   [[consumer]] id = "projectb-backend"       (writer template)
#   [[consumer]] id = "projectb-frontend"      (writer template)
#   ...
#
# Each gets a freshly generated argon2id token_hash.
# Tokens are displayed once in cleartext at init for distribution to consumers.

# ─── Domain experts (thematic, read-only by default) ──────────────────
# Thematic experts scoped to the whole vault, read-only (write_patterns empty).
# Map these roles to whatever domain specialists an installation runs.

# expert-prompt — prompt engineering, terminology coherence
[[consumer]]
identity = "expert-prompt"
description = "Domain expert — prompt engineering, terminology coherence"
read_patterns  = ["**"]
write_patterns = []
sees_personal_classified = false

# expert-llm — LLM model selection, tuning, cost
[[consumer]]
identity = "expert-llm"
description = "Domain expert — LLM model selection, tuning, cost"
read_patterns  = ["**"]
write_patterns = []
sees_personal_classified = false

# expert-infra — infrastructure, virtualization, networking, storage
