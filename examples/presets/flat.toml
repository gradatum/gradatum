# Gradatum preset — flat
#
# Pattern: a single locus, no isolation. Useful for:
# - Migrating from predecessor system v1.x (no loci concept)
# - Single-user, single-context deployment
# - Fastest onboarding for OSS evaluation
#
# Apply with: gradatum-admin init --preset=flat

[[consumer]]
id = "default"
description = "Single consumer, full read/write on the only locus 'default'"
read_patterns = ["default"]
write_patterns = ["default"]
sees_personal_classified = false
# token_hash will be generated by gradatum-admin init
