# NOTE: this workflow runs ONLY on self-hosted Forgejo runners (not GitHub Actions).
name: release

on:
  push:
    tags: ['v*']

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

# Release pipeline (T12 P2.0c — multi-target binaries + Docker buildx multi-arch)
#
# Sequence:
#   1. ci-gate      — fmt + clippy + nextest --release + audit + deny (BLOCKING)
#   2. build-x86_64 — Linux x86_64 native (REQUIRED — gates `release` job)
#   2. build-arm64  — Linux aarch64 cross (BEST-EFFORT — continue-on-error, non-bloquant)
#   3. build-docker — docker buildx multi-arch linux/amd64,linux/arm64 → ghcr.io PRIVATE
#   4. release      — SHA256SUMS + Forgejo release API (needs: [build-x86_64] uniquement)
#
# Platform: Linux-only (x86_64 + aarch64). Windows support deferred 2026-06-05.
#
# Runtime secrets required:
#   - secrets.GHCR_GRADATUM_TOKEN  → manual setup (org GitHub gradatum + PRIVATE registry)
#   - secrets.FORGEJO_TOKEN        → Forgejo runner token (create release API)
#
# NOTE: arm64 cross requires Docker on runner (cross v0.2.5). Non-blocking (continue-on-error).
#   TODO PR-Z5: provision Docker on runner gradatum-ci.
#
# Architecture: matrix + continue-on-error individuel est incompatible avec needs: aval (bug Forgejo/GitHub
#   Actions standard — status global matrix = failure si >=1 entry failure meme avec continue-on-error).
#   Solution retenue : jobs distincts -> decouplage semantique et technique des dependances.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # ci-gate — full CI suite on the release tag (BLOCKING)
  # fmt + clippy + nextest --release + cargo deny check (replaces cargo audit)
  # ─────────────────────────────────────────────────────────────────────────
  ci-gate:
    name: ci-gate (lint + test + audit + deny)
    runs-on: [self-hosted, linux, x64, gradatum-ci]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install stable toolchain with rustfmt + clippy
        run: |
          rustup toolchain install stable --component rustfmt --component clippy --no-self-update
          rustup default stable

      - name: Cache cargo registry + build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: cargo-release-ci-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-ci-${{ runner.os }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Install cargo-nextest
        run: cargo install cargo-nextest --locked 2>/dev/null || true

      - name: cargo nextest run --workspace --release
        # --all-features exclut fastembed-cpu (ort-2.0.0-rc.9 build failure, T08 Concern Phase 1)
        run: cargo nextest run --workspace --release

      - name: Install cargo-deny
        run: cargo install cargo-deny --locked 2>/dev/null || true

      - name: cargo deny check advisories (BLOCKING)
        # deny.toml is single source of truth — replaces cargo audit --deny warnings
        run: cargo deny check advisories

      - name: cargo deny check (BLOCKING)
        run: cargo deny check

  # ─────────────────────────────────────────────────────────────────────────
  # build-x86_64 — Linux x86_64 native (REQUIRED — gates `release` job)
  #
  # Canonical target pour le déploiement Linux x86_64 + GHCR alpha. Job bloquant pour release.
  # ─────────────────────────────────────────────────────────────────────────
  build-x86_64:
    name: build-x86_64
    needs: ci-gate
    runs-on: [self-hosted, linux, x64, gradatum-ci]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install stable toolchain + target
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu

      - name: Cache cargo registry + build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: cargo-release-build-x86_64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-build-x86_64-

      - name: Build (native)
        run: |
          cargo build --release \
            -p gradatum-server \
            -p gradatum-worker \
            -p gradatum-admin \
            -p gradatum-cli \
            -p gradatum-mcp-stub \
            --target x86_64-unknown-linux-gnu

      - name: Package (tar.gz)
        run: |
          mkdir -p dist
          tar -czvf dist/gradatum-x86_64-unknown-linux-gnu.tar.gz \
            -C target/x86_64-unknown-linux-gnu/release \
            gradatum-server \
            gradatum-worker \
            gradatum-admin \
            gradatum-cli \
            gradatum-mcp-stub

      - name: Upload binaries artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: binaries-x86_64-unknown-linux-gnu
          path: dist/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # build-arm64 — Linux aarch64 cross (BEST-EFFORT — non-bloquant)
  # TODO PR-Z5 : nécessite Docker sur runner gradatum-ci (cross v0.2.5 dependency)
  # ─────────────────────────────────────────────────────────────────────────
  build-arm64:
    name: build-arm64
    needs: ci-gate
    runs-on: [self-hosted, linux, x64, gradatum-ci]
    continue-on-error: true
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Install stable toolchain + target
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustup target add aarch64-unknown-linux-gnu

      - name: Cache cargo registry + build
        uses: https://code.forgejo.org/actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/
          key: cargo-release-build-arm64-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            cargo-release-build-arm64-

      - name: Install cross
        run: cargo install cross --locked

      - name: Build (cross)
        run: |
          cross build --release \
            -p gradatum-server \
            -p gradatum-worker \
            -p gradatum-admin \
            -p gradatum-cli \
            -p gradatum-mcp-stub \
            --target aarch64-unknown-linux-gnu

      - name: Package (tar.gz)
        run: |
          mkdir -p dist
          tar -czvf dist/gradatum-aarch64-unknown-linux-gnu.tar.gz \
            -C target/aarch64-unknown-linux-gnu/release \
            gradatum-server \
            gradatum-worker \
            gradatum-admin \
            gradatum-cli \
            gradatum-mcp-stub

      - name: Upload binaries artifact
        uses: https://code.forgejo.org/actions/upload-artifact@v3
        with:
          name: binaries-aarch64-unknown-linux-gnu
          path: dist/
          retention-days: 90

  # ─────────────────────────────────────────────────────────────────────────
  # build-docker — multi-arch linux/amd64,linux/arm64 → ghcr.io PRIVATE
  #
  # Requires: secrets.GHCR_GRADATUM_TOKEN (manual setup)
  # Registry: ghcr.io/gradatum/gradatum (PRIVATE — org gradatum GitHub)
  # Tags: <version_tag> + alpha + latest
  # ─────────────────────────────────────────────────────────────────────────
  build-docker:
    name: build-docker (multi-arch ghcr.io)
    needs: ci-gate
    runs-on: [self-hosted, linux, x64, gradatum-ci]
    # TODO PR-Z5 : Docker non installé sur le runner gradatum-ci. Skip jusqu'à
    #              provision d'un runner Docker (runner dédié ou Docker-in-container).
    #              Re-activer en retirant `if: false` ci-dessous.
    if: false
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Set up QEMU (arm64 emulation)
        uses: https://github.com/docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: https://github.com/docker/setup-buildx-action@v3

      - name: Login to ghcr.io
        uses: https://github.com/docker/login-action@v3
        with:
          registry: ghcr.io
          username: gradatum
          password: ${{ secrets.GHCR_GRADATUM_TOKEN }}

      - name: Build and push multi-arch image
        uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/gradatum/gradatum:${{ github.ref_name }}
            ghcr.io/gradatum/gradatum:alpha
            ghcr.io/gradatum/gradatum:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # release — SHA256SUMS + Forgejo release creation via API
  #
  # Requires: secrets.FORGEJO_TOKEN (repo-scoped write token)
  # Downloads all binaries artifacts, computes checksums, creates Forgejo release.
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: release (Forgejo + SHA256SUMS)
    needs: [build-x86_64]
    # D-08 P2 fix : force scheduling si build-x86_64 SUCCESS même si arm64
    # FAIL (continue-on-error). Forgejo Actions 12.x bug — needs: aval ne déclenche
    # pas le job si autres jobs build-* échouent malgré continue-on-error individuel.
    if: ${{ always() && needs.build-x86_64.result == 'success' }}
    runs-on: [self-hosted, linux, x64, gradatum-ci]
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v4

      - name: Download all binaries artifacts
        uses: https://code.forgejo.org/actions/download-artifact@v3
        with:
          path: dist/

      - name: Flatten dist directory
        run: |
          # download-artifact@v4 places each artifact in a subdirectory
          # Flatten: dist/binaries-<target>/<file> → dist/<file>
          find dist/ -mindepth 2 -maxdepth 2 \( -name "*.tar.gz" -o -name "*.zip" \) \
            -exec mv {} dist/ \;
          # Remove now-empty subdirs
          find dist/ -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} + 2>/dev/null || true
          ls -lh dist/

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum *.tar.gz *.zip 2>/dev/null > SHA256SUMS || sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Create Forgejo release via API
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          # Use Forgejo Actions runtime vars (anti-leak Pilier 1, Phase C OSS flip readiness 2026-05-26)
          # Note: gitea.repository_owner échoue validation schéma Forgejo runner — utiliser github.repository_owner
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"
          FORGEJO_URL="http://localhost:3000"

          # Create release (draft=false, prerelease=true for alpha/beta tags)
          IS_PRERELEASE="false"
          if echo "$TAG" | grep -qE "alpha|beta|rc"; then
            IS_PRERELEASE="true"
          fi

          echo "Creating Forgejo release $TAG (prerelease=$IS_PRERELEASE)..."
          RELEASE_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST \
            -H "Authorization: token ${FORGEJO_TOKEN}" \
            -H "Content-Type: application/json" \
            "${FORGEJO_URL}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}/releases" \
            -d "{
              \"tag_name\": \"${TAG}\",
              \"name\": \"${TAG}\",
              \"body\": \"Release ${TAG} — see CHANGELOG.md for details.\",
              \"draft\": false,
              \"prerelease\": ${IS_PRERELEASE}
            }")

          HTTP_CODE=$(echo "$RELEASE_RESPONSE" | tail -1)
          RESPONSE_BODY=$(echo "$RELEASE_RESPONSE" | head -n -1)

          if [ "$HTTP_CODE" != "201" ]; then
            echo "ERROR: Failed to create release (HTTP $HTTP_CODE)"
            echo "$RESPONSE_BODY"
            exit 1
          fi

          RELEASE_ID=$(echo "$RESPONSE_BODY" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          echo "Release created: id=$RELEASE_ID"

          # Upload all artifacts as release assets
          for file in dist/*.tar.gz dist/*.zip dist/SHA256SUMS; do
            [ -f "$file" ] || continue
            filename=$(basename "$file")
            echo "Uploading $filename..."
            curl -s -o /dev/null -w "%{http_code} $filename\n" \
              -X POST \
              -H "Authorization: token ${FORGEJO_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${file}" \
              "${FORGEJO_URL}/api/v1/repos/${REPO_OWNER}/${REPO_NAME}/releases/${RELEASE_ID}/assets?name=${filename}"
          done

          echo "Release $TAG published successfully."
